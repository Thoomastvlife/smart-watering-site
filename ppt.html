<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>簡報｜讓綠意蔓延吧</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
:root{--bg:#0c1a18;--bar:#14302b;--ink:#e3f0ec;--muted:#9bb5af;--accent:#5fc48a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y;user-select:none}
#stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;box-shadow:0 8px 40px rgba(0,0,0,.45)}
.zone{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;color:transparent}
.zone.l{left:0}.zone.r{right:0}
.zone:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);font-size:.92rem}
#bar .t{margin-right:auto;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button,#bar a{font:inherit;color:var(--ink);background:transparent;border:2px solid #2a4f48;border-radius:8px;padding:4px 12px;text-decoration:none;cursor:pointer;line-height:1.4}
#bar button:hover,#bar a:hover{border-color:var(--accent)}
#bar button:focus-visible,#bar a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#cnt{min-width:4.5em;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#prog{height:4px;background:#1d3a35}#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
body.fs #bar{display:none}
@media (max-width:560px){#bar .t{display:none}#bar{justify-content:center}}
</style>
</head>
<body>
<div id="prog"><i id="pbar"></i></div>
<div id="stage">
  <img id="img" src="/ppt-assets/s01.jpg" width="1467" height="825" alt="">
  <button class="zone l" id="zl" aria-label="上一頁"></button>
  <button class="zone r" id="zr" aria-label="下一頁"></button>
</div>
<div id="bar">
  <span class="t">讓綠意蔓延吧｜智慧澆水系統簡報</span>
  <button id="bp" aria-label="上一頁">‹ 上一頁</button>
  <span id="cnt" aria-live="polite">1 / 14</span>
  <button id="bn" aria-label="下一頁">下一頁 ›</button>
  <button id="bf" aria-label="全螢幕">全螢幕</button>
  <a href="/ppt-assets/deck.pptx" download="讓綠意蔓延吧_智慧澆水系統簡報.pptx">下載 PPTX</a>
</div>
<script>
(function(){
  var alts=["封面：讓綠意蔓延吧","專題動機與簡介","核心創意：一管三盆","系統架構","硬體設備與用途","軟體與網路技術","自動運作流程","智慧循環與安全防呆","遠端網頁監控與手動控制","手機即時推播通知","實測結果","作品優勢與應用性","結論與未來展望","參考資料"];
  var N=alts.length,i=0,img=document.getElementById("img");
  function src(n){return "/ppt-assets/s"+(n<9?"0":"")+(n+1)+".jpg"}
  function show(n){
    i=Math.max(0,Math.min(N-1,n));
    img.src=src(i);img.alt="第 "+(i+1)+" 頁："+alts[i];
    document.getElementById("cnt").textContent=(i+1)+" / "+N;
    document.getElementById("pbar").style.width=((i+1)/N*100)+"%";
    document.title=(i+1)+"/"+N+" "+alts[i]+"｜簡報";
    if(i<N-1){new Image().src=src(i+1)}
    if(i>0){new Image().src=src(i-1)}
    try{history.replaceState(null,"","#"+(i+1))}catch(e){}
  }
  function next(){show(i+1)}function prev(){show(i-1)}
  function fs(){
    var d=document,e=d.documentElement;
    if(d.fullscreenElement){d.exitFullscreen()}
    else if(e.requestFullscreen){e.requestFullscreen()}
  }
  document.addEventListener("fullscreenchange",function(){document.body.classList.toggle("fs",!!document.fullscreenElement)});
  document.getElementById("zr").onclick=next;document.getElementById("zl").onclick=prev;
  document.getElementById("bn").onclick=next;document.getElementById("bp").onclick=prev;
  document.getElementById("bf").onclick=fs;
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(k==="ArrowRight"||k==="PageDown"||k===" "||k==="Enter"){e.preventDefault();next()}
    else if(k==="ArrowLeft"||k==="PageUp"||k==="Backspace"){e.preventDefault();prev()}
    else if(k==="Home"){show(0)}else if(k==="End"){show(N-1)}
    else if(k==="f"||k==="F"){fs()}
  });
  var sx=null;
  var st=document.getElementById("stage");
  st.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
  st.addEventListener("touchend",function(e){
    if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>50){dx<0?next():prev()}
  },{passive:true});
  var h=parseInt((location.hash||"").slice(1),10);
  show(h>=1&&h<=N?h-1:0);
})();
</script>
</body>
</html>
