<figure style="max-width:620px"><img src="img/device.jpg" width="1000" height="1000" alt="智慧澆水系統實機" loading="lazy"><figcaption>智慧澆水系統實機。</figcaption></figure>
<div class="grid" style="margin-top:18px"><div><h3>上層：移動軌道與植物</h3><p>步進馬達帶動皮帶，讓滑塊把澆水頭對準三盆植物。</p></div><div><h3>下層：控制核心</h3><p>ESP32、麵包板、繼電器與驅動器集中在下層。</p></div><div><h3>水箱與水泵</h3><p>水泵從水箱抽水，透過水管送到澆水頭。</p></div></div>
<h2>三種操作方式</h2>
<div class="shots">
<figure><img src="img/web.jpg" width="640" height="885" alt="網頁儀表板截圖，顯示目前位置、移動狀態、水泵狀態與紅外線狀態" loading="lazy"><figcaption><strong>網頁儀表板</strong><br>即時狀態、紅外線狀態、各盆濕度與 ADC 數值，並可手動移到位置 1～3、停止滑塊、開關水泵。</figcaption></figure>
<figure><img src="img/ntfy.jpg" width="640" height="778" alt="ntfy 手機通知截圖，顯示定時狀態與澆水未完成警示" loading="lazy"><figcaption><strong>ntfy 手機推播</strong><br>每 30 秒回報位置、水泵與三盆濕度，開始澆水或異常時立即通知，每則都有時間戳記。</figcaption></figure>
<figure><img src="img/blynk.jpg" width="640" height="885" alt="Blynk 手機介面截圖，顯示三個開關、三個濕度表與目前位置" loading="lazy"><figcaption><strong>Blynk 手機介面</strong><br>用開關與儀表查看三盆濕度和目前位置，隨時遠端控制。</figcaption></figure></div><div class="pager"><span><a href="architecture.html">‹ 軟硬體架構</a></span><span><a href="results.html">實測紀錄 ›</a></span></div></main><footer class="wrap">讓綠意蔓延吧｜智慧澆水系統　新北市立鶯歌高級工商職業學校 資訊科</footer></body></html>
